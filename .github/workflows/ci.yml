name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-latest:
    name: SDK latest compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Resolve SDK latest from npm
        run: node scripts/prepare-ci-sdk.mjs
      - name: Install dependencies with latest SDK
        run: pnpm install --no-frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Report installed SDK
        run: pnpm list @lingya-ai/agents-sdk --depth 0 -r
      - name: Check types
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Check API contracts
        run: pnpm contracts:check
      - name: Test
        run: pnpm test
      - name: Build registry
        run: pnpm registry:build
      - name: Build documentation
        run: pnpm build:docs
      - name: Build Vite example
        run: pnpm build:vite

