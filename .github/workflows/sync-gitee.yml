name: Sync to Gitee

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-gitee
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'lingya-ai/xlt-agent-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check configuration
        env:
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          GITEE_KNOWN_HOSTS: ${{ secrets.GITEE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITEE_REPOSITORY" =~ ^git@gitee\.com:[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+\.git$ ]]; then
            echo '::error::请配置 GITEE_REPOSITORY，格式为 git@gitee.com:组织或账号/仓库.git'
            exit 1
          fi
          if [[ -z "$GITEE_SSH_PRIVATE_KEY" || -z "$GITEE_KNOWN_HOSTS" ]]; then
            echo '::error::请配置 GITEE_SSH_PRIVATE_KEY 和 GITEE_KNOWN_HOSTS secrets'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror all branches and tags
        env:
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          GITEE_KNOWN_HOSTS: ${{ secrets.GITEE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$GITEE_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o ConnectTimeout=30"
          # 使用独立引用空间读取最新 GitHub 状态，不复制 PR 等平台内部引用
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/gitee-sync/heads/*' \
            '+refs/tags/*:refs/gitee-sync/tags/*'
          git push --atomic --prune "$GITEE_REPOSITORY" \
            '+refs/gitee-sync/heads/*:refs/heads/*' \
            '+refs/gitee-sync/tags/*:refs/tags/*'
          printf '%s\n' '已完全同步所有分支和标签到 Gitee，包括删除和强制更新' >> "$GITHUB_STEP_SUMMARY"
